<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>HenDy Live Stream - Test Environment</title>
    <style>
        :root {
            --color-bg: #0f172a;
            --color-panel: #1e293b;
            --color-border: #334155;
            --color-accent: #10b981;
        }
        body {
            background-color: var(--color-bg);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .stream-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .live-screen {
            background: #000;
            width: 100%;
            max-height: 70vh;
            aspect-ratio: 16/9;
            border-radius: 8px;
            position: relative;
            border: 1px solid var(--color-border);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .live-screen video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: filter 0.3s ease;
        }
        .live-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(220, 38, 38, 0.85);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }
        .live-badge.offline {
            background: rgba(100, 116, 139, 0.85);
        }
        .live-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        .live-badge.offline::before {
            animation: none;
            background: #cbd5e1;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .video-controls-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            border-top: 1px solid var(--color-border);
            z-index: 10;
        }
        .video-controls-bar button, .video-controls-bar select {
            background: #334155;
            border: none;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .video-controls-bar button:hover { background: #475569; }
        .video-controls-bar input[type="range"] {
            width: 80px;
            cursor: pointer;
        }
        .chat-section {
            background: var(--color-panel);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            height: 600px;
            padding: 12px;
        }
        .chat-header {
            font-weight: bold;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 8px;
            margin-bottom: 8px;
            color: var(--color-accent);
            font-size: 13px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            background: #0f172a;
            border: 1px solid var(--color-border);
            border-radius: 6px;
            padding: 8px;
            font-family: monospace;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-input-area {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-wrapper {
            display: flex;
            gap: 6px;
        }
        input[placeholder*="bình luận"] {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--color-border);
            color: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
        }
        input[placeholder*="bình luận"]:focus {
            border-color: var(--color-accent);
        }
        button.send-btn {
            background: var(--color-accent);
            border: none;
            color: white;
            padding: 0 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        button.send-btn:hover { background: #059669; }
        .control-panel-dev {
            background: var(--color-panel);
            border: 1px solid var(--color-border);
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .control-panel-dev.collapsed .panel-body {
            display: none;
        }
        .panel-header-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            color: #fbbf24;
            cursor: pointer;
        }
        .btn-sim {
            background: #334155;
            border: none;
            color: #f8fafc;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin: 3px;
        }
        .btn-sim:hover { background: #475569; }
        .control-group {
            margin-bottom: 8px;
            font-size: 12px;
        }
        .control-group label {
            color: #94a3b8;
            margin-right: 6px;
        }
        .custom-file-upload {
            border: 1px dashed #475569;
            display: inline-block;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 4px;
            background: #0f172a;
            font-size: 11px;
            color: #38bdf8;
        }
        .custom-file-upload:hover { background: #1e293b; }
    </style>
</head>
<body>

<div class="main-layout" id="appContainer" style="display: none;">
    <div class="stream-section">
        <div class="live-screen" id="liveScreen">
            <div id="liveBadge" class="live-badge">ĐANG PHÁT TRỰC TIẾP</div>
            <video id="liveVideo" autoplay muted loop>
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            </video>

            <!-- Thanh điều khiển âm lượng, phát/tạm dừng và tỉ lệ khung hình -->
            <div class="video-controls-bar">
                <button id="playPauseBtn" onclick="togglePlayPause()">⏸️ Tạm dừng</button>
                <button id="muteBtn" onclick="toggleMute()">🔇 Bật tiếng</button>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0" oninput="changeVolume(this.value)">
                <div style="flex:1"></div>
                <span style="font-size:11px; color:#94a3b8;">Khung hình:</span>
                <select id="fitModeSelect" onchange="changeFitMode(this.value)">
                    <option value="contain">Vừa khít (Contain)</option>
                    <option value="cover">Tràn khung (Cover)</option>
                    <option value="fill">Kéo giãn (Fill)</option>
                </select>
            </div>
        </div>

        <div class="control-panel-dev" id="controlPanel">
            <div class="panel-header-title" onclick="togglePanelCollapse()">
                <span>⚙️ Bảng Điều Khiển Giả Lập Tín Hiệu & Hiệu Ứng Phòng Live</span>
                <span id="toggleIcon" style="background:#334155; padding:2px 8px; border-radius:4px; font-size:10px;">[Ẩn]</span>
            </div>
            
            <div class="panel-body" style="margin-top: 10px;">
                <div class="control-group">
                    <button class="btn-sim" onclick="injectChat('Mod_Master', 'ĐIỂM DANH + HenDy +')">Giả lập Điểm Danh từ Mod</button>
                    <button class="btn-sim" onclick="injectChat('Vip_Pro', 'HenDy + Xỉu + user123')">Giả lập Kèo Xỉu (Vip)</button>
                    <button class="btn-sim" onclick="injectChat('User_XYZ', 'Bot ơi điểm danh đi')">Giả lập gọi tên Bot</button>
                    <button class="btn-sim" onclick="location.href='/dashboard'" style="background: #2563eb;">Mở Dashboard Quản Lý</button>
                </div>

                <hr style="border-color: #334155; margin: 8px 0;">

                <div class="control-group" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                    <label>🎞️ Chọn Video:</label>
                    <select id="videoSourceSelect" onchange="handleVideoPresetChange(this.value)" style="background:#0f172a; color:#fff; border:1px solid #334155; padding:4px; border-radius:4px; font-size:11px;">
                        <option value="https://www.w3schools.com/html/mov_bbb.mp4">Big Buck Bunny (Mặc định)</option>
                        <option value="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm">Flower (MDN Test)</option>
                        <option value="https://www.w3schools.com/html/movie.mp4">Bear Movie</option>
                        <option value="custom_url">🔗 Nhập URL bên ngoài...</option>
                    </select>

                    <label class="custom-file-upload">
                        📁 Tải video từ máy
                        <input type="file" id="localVideoUpload" accept="video/*" style="display: none;" onchange="handleLocalVideoUpload(this)" />
                    </label>
                </div>

                <div class="control-group">
                    <label>🎨 Hiệu ứng màu:</label>
                    <button class="btn-sim" onclick="setVideoFilter('none')">Bình thường</button>
                    <button class="btn-sim" onclick="setVideoFilter('grayscale(100%)')">Đen Trắng</button>
                    <button class="btn-sim" onclick="setVideoFilter('sepia(100%)')">Cổ Điển</button>
                    <button class="btn-sim" onclick="setVideoFilter('hue-rotate(90deg)')">Neon Xanh</button>
                    <button class="btn-sim" onclick="setVideoFilter('invert(100%)')">Đảo Ngược</button>
                </div>

                <div class="control-group">
                    <label>⚡ Trạng thái Live:</label>
                    <button class="btn-sim" onclick="toggleLiveStatus(true)" style="background:#059669;">Bật Live (Online)</button>
                    <button class="btn-sim" onclick="toggleLiveStatus(false)" style="background:#dc2626;">Tắt Live (Offline)</button>
                </div>
            </div>
        </div>
    </div>

    <div class="chat-section">
        <div class="chat-header">💬 Khung Trò Chuyện Trực Tuyến (HenDy Mock)</div>
        <div class="chat-messages" id="chatMessages">
            <div><span style="color: #64748b;">[System]</span> Chào mừng bạn đến phòng test tool Tampermonkey.</div>
        </div>
        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="chatInput" placeholder="Nhập nội dung bình luận..." />
                <button class="send-btn" id="sendBtn">Gửi</button>
            </div>
        </div>
    </div>
</div>

<!-- Thông báo nếu truy cập sai tên miền -->
<div id="unauthorizedMsg" style="display: none; text-align: center; margin-top: 150px; color: #ef4444; font-family: sans-serif;">
    <h2>403 - Truy cập bị từ chối</h2>
    <p style="color: #94a3b8;">Trang này chỉ hiển thị khi truy cập qua đường dẫn chính thức.</p>
</div>

<script>
    // Kiểm tra tên miền chính xác (cho phép cả local để test khi dev nếu cần)
    const allowedHostname = "hendy-server-test.up.railway.app";
    const currentHost = window.location.hostname;

    // Nếu bạn muốn cho phép test cả trên localhost thì bật dòng dưới, còn không thì bỏ comment
    if (currentHost === allowedHostname || currentHost === "localhost" || currentHost === "127.0.0.1") {
        document.getElementById('appContainer').style.display = 'grid';
    } else {
        document.getElementById('unauthorizedMsg').style.display = 'block';
    }

    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const chatMessages = document.getElementById('chatMessages');
    const liveVideo = document.getElementById('liveVideo');
    const liveScreen = document.getElementById('liveScreen');
    const liveBadge = document.getElementById('liveBadge');
    const controlPanel = document.getElementById('controlPanel');
    const toggleIcon = document.getElementById('toggleIcon');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const videoSourceSelect = document.getElementById('videoSourceSelect');

    let currentIsOnLive = 1;
    let isPanelCollapsed = false;

    function getBotNickname() {
        return "Khách_474 (Bot)"; 
    }

    function appendMessage(sender, text, color = "#f8fafc") {
        const div = document.createElement('div');
        div.innerHTML = `<span style="color: #64748b;">[${new Date().toLocaleTimeString()}]</span> <b style="color: ${color};">${sender}:</b> ${text}`;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleUserSubmit() {
        const val = chatInput.value.trim();
        if (!val) return;
        const botName = getBotNickname();
        appendMessage(botName, val, "#38bdf8");
        chatInput.value = '';
        chatInput.dispatchEvent(new Event('input', { bubbles: true }));
    }

    sendBtn.addEventListener('click', handleUserSubmit);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleUserSubmit();
    });

    window.injectChat = function(sender, text) {
        let color = sender.includes('Mod') ? '#fbbf24' : (sender.includes('Vip') ? '#ec4899' : '#34d399');
        appendMessage(sender, text, color);
    };

    liveVideo.addEventListener('loadedmetadata', function() {
        const videoWidth = liveVideo.videoWidth;
        const videoHeight = liveVideo.videoHeight;
        if (videoWidth && videoHeight) {
            liveScreen.style.aspectRatio = `${videoWidth} / ${videoHeight}`;
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        const savedVideoUrl = localStorage.getItem('hendy_saved_video_url');
        if (savedVideoUrl) {
            liveVideo.src = savedVideoUrl;
            liveVideo.load();
            liveVideo.play().catch(e => {});
            
            let matchFound = false;
            for (let option of videoSourceSelect.options) {
                if (option.value === savedVideoUrl) {
                    videoSourceSelect.value = savedVideoUrl;
                    matchFound = true;
                    break;
                }
            }
            if (!matchFound) {
                appendMessage("System", "Đã tự động tải lại video tùy chỉnh từ lần trước.", "#fbbf24");
            }
        }
    });

    window.togglePanelCollapse = function() {
        isPanelCollapsed = !isPanelCollapsed;
        if (isPanelCollapsed) {
            controlPanel.classList.add('collapsed');
            toggleIcon.innerText = '[Hiện]';
        } else {
            controlPanel.classList.remove('collapsed');
            toggleIcon.innerText = '[Ẩn]';
        }
    };

    window.handleVideoPresetChange = function(url) {
        if (url === 'custom_url') {
            const customUrl = prompt("Nhập đường dẫn URL video (.mp4, .webm...):");
            if (customUrl) {
                setVideoSource(customUrl, true);
            }
            return;
        }
        setVideoSource(url, true);
    };

    window.handleLocalVideoUpload = function(input) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const fileURL = URL.createObjectURL(file);
            setVideoSource(fileURL, false);
            appendMessage("System", `Đã tải lên video từ máy: ${file.name}`, "#38bdf8");
        }
    };

    function setVideoSource(url, saveToStorage = true) {
        liveVideo.src = url;
        liveVideo.load();
        liveVideo.play().catch(e => {});
        
        if (saveToStorage && !url.startsWith('blob:')) {
            localStorage.setItem('hendy_saved_video_url', url);
        }
        appendMessage("System", "Đã cập nhật và lưu nguồn video cho lần sau.", "#fbbf24");
    }

    window.setVideoFilter = function(filterStyle) {
        liveVideo.style.filter = filterStyle;
        appendMessage("System", `Đã chuyển hiệu ứng video sang: ${filterStyle}`, "#38bdf8");
    };

    window.changeFitMode = function(mode) {
        liveVideo.style.objectFit = mode;
        appendMessage("System", `Đã đổi khung hiển thị video sang: ${mode}`, "#38bdf8");
    };

    window.togglePlayPause = function() {
        if (liveVideo.paused) {
            liveVideo.play();
            playPauseBtn.innerText = "⏸️ Tạm dừng";
        } else {
            liveVideo.pause();
            playPauseBtn.innerText = "▶️ Tiếp tục";
        }
    };

    window.toggleMute = function() {
        liveVideo.muted = !liveVideo.muted;
        if (liveVideo.muted) {
            muteBtn.innerText = "🔇 Bật tiếng";
            volumeSlider.value = 0;
        } else {
            muteBtn.innerText = "🔊 Tắt tiếng";
            volumeSlider.value = liveVideo.volume || 0.5;
            liveVideo.volume = liveVideo.volume || 0.5;
        }
    };

    window.changeVolume = function(val) {
        liveVideo.volume = parseFloat(val);
        if (val > 0) {
            liveVideo.muted = false;
            muteBtn.innerText = "🔊 Tắt tiếng";
        } else {
            liveVideo.muted = true;
            muteBtn.innerText = "🔇 Bật tiếng";
        }
    };

    window.toggleLiveStatus = function(status) {
        currentIsOnLive = status ? 1 : 0;
        if (status) {
            liveBadge.className = "live-badge";
            liveBadge.innerText = "ĐANG PHÁT TRỰC TIẾP";
            liveVideo.style.opacity = "1";
            appendMessage("System", "Trạng thái phòng chuyển sang: Đang Live 🟢", "#10b981");
        } else {
            liveBadge.className = "live-badge offline";
            liveBadge.innerText = "ĐÃ KẾT THÚC LIVE";
            liveVideo.style.opacity = "0.3";
            appendMessage("System", "Trạng thái phòng chuyển sang: Ngoại tuyến 🔴", "#ef4444");
        }
        sendSyncStatus();
    };

    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${location.host}`);
    let mySlaveId = 'tab_' + Math.random().toString(36).substring(2, 6);
    
    ws.onopen = () => {
        console.log('🔗 Đã kết nối WebSocket Hub thành công');
        ws.send(JSON.stringify({
            action: 'SYNC_REGISTER_TAB',
            value: { id: mySlaveId, name: 'Hendy_Tester', role: 'MOD', channel: 'MOCK-LIVE' }
        }));
        sendSyncStatus();
    };

    function sendSyncStatus() {
        if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                action: 'SYNC_STATUS',
                slaveId: mySlaveId,
                is_on_live: currentIsOnLive,
                url: window.location.href,
                nickname: 'Hendy_Tester'
            }));
        }
    }

    setInterval(sendSyncStatus, 5000);

    ws.onmessage = (event) => {
        try {
            const data = JSON.parse(event.data);
            if (data.action && data.action.startsWith('CHAT|')) {
                const msg = data.action.split('|')[1];
                chatInput.value = msg;
                handleUserSubmit();
            }
        } catch(e) {}
    };
</script>

</body>
</html>
